name: pipeline-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/pipeline/requirements.txt

      - name: Install validator deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run validator tests
        run: python -m pytest tools/tests/ -v
