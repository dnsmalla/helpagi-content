# Pipeline runtime config. Read by the agent via the Read tool.

# Set to true during shadow week. Articles are written to _proposed/<date>/
# and committed for review, but NOT appended to articles.json.
dry_run: true

# Hard cap on new articles per run. Keeps subscription usage predictable.
daily_article_cap: 5

# Per-article web-research budget: max number of WebFetch calls the agent
# may make while filling in factual gaps the transcript doesn't cover.
# Lower = leaner runs, fewer references; higher = better-researched articles
# at higher token cost.
research_budget: 4

# yt-dlp filter: video duration in seconds.
video_duration_min_sec: 300     # 5 min — skip Shorts and trailers
video_duration_max_sec: 5400    # 90 min — bigger transcripts blow up context

# Topic-keyword filter. Single source of truth: read by the agent (title-stage
# filter, substring case-insensitive) and by tools/validate_article.py
# (post-write filter, whole-word case-insensitive on title + first ~200 words).
topic_keywords:
  - AI
  - AGI
  - artificial intelligence
  - machine learning
  - neural
  - LLM
  - GPT
  - transformer
  - deep learning
  - engineering
  - software
  - DevOps
  - compiler
  - agent
  - robotics

# Manual override list. Add a video ID here to skip it in future runs.
manual_skip_video_ids: []
